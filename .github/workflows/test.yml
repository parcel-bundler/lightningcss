name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: full
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt
      - run: cargo test --all-features

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - uses: bahmutov/npm-install@v1.8.32
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: yarn build
      - run: yarn test
      - run: yarn tsc

  test-riscv64:
    # Cross-builds the linux-riscv64-gnu binding the same way release.yml does,
    # then runs the JS test suite against it under QEMU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - uses: bahmutov/npm-install@v1.8.32
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup rust target
        run: rustup target add riscv64gc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu
      - run: yarn build
        env:
          RUST_TARGET: riscv64gc-unknown-linux-gnu
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - name: Run tests under QEMU
        run: |
          docker run --rm --platform linux/riscv64 -v "$PWD":/src -w /src debian:trixie sh -c \
            'apt-get update -qq && apt-get install -y -qq nodejs > /dev/null && node --version && node node_modules/uvu/bin.js node/test'

  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - uses: bahmutov/npm-install@v1.8.32
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Setup rust target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-opt
        run: |
          curl -L -O https://github.com/WebAssembly/binaryen/releases/download/version_111/binaryen-version_111-x86_64-linux.tar.gz
          tar -xf binaryen-version_111-x86_64-linux.tar.gz
      - name: Build wasm
        run: |
          export PATH="$PATH:./binaryen-version_111/bin"
          yarn wasm:build-release
      - run: TEST_WASM=node yarn test
      - run: TEST_WASM=browser yarn test
