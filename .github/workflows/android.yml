name: Build LightningCSS Android ARMv7

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    name: Android ARMv7
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/codebysushil/linux-android-armv7/linux-android-armv7:latest
      # image: ghcr.io/codebysushil/linux-android-armv7/linux-android-armv7:latest

    env:
      RUST_TARGET: armv7-linux-androideabi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: bash
        run: |
          set -eux

          node --version
          npm --version
          yarn --version

          rustc --version
          cargo --version

          clang --version
          llvm-strip --version

          ndk-build --version || true

      - name: Detect Android NDK
        shell: bash
        run: |
          set -e

          echo "Searching for Android NDK..."

          NDK=""

          for dir in \
            "${ANDROID_NDK_LATEST_HOME:-}" \
            "${ANDROID_NDK_HOME:-}" \
            "/opt/android-sdk/ndk"/* \
            "/opt/android-ndk" \
            "/usr/local/android-ndk" \
            "/android-sdk/ndk"/* \
            "/sdk/ndk"/*
          do
            if [ -n "$dir" ] && [ -d "$dir" ]; then
              if [ -f "$dir/source.properties" ]; then
                NDK="$dir"
                break
              fi
            fi
          done

          if [ -z "$NDK" ]; then
            echo "ERROR: Android NDK was not found."
            echo
            echo "Searching filesystem:"
            find / -type f -name source.properties 2>/dev/null \
              | grep -i ndk \
              | head -20 || true

            exit 1
          fi

          echo "Android NDK found:"
          echo "$NDK"

          echo "ANDROID_NDK_LATEST_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Verify Android NDK
        shell: bash
        run: |
          set -eux

          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          test -d "$ANDROID_NDK_LATEST_HOME"

          ls -la "$ANDROID_NDK_LATEST_HOME"

      - name: Verify ARMv7 compiler
        shell: bash
        run: |
          set -e

          echo "Searching for ARMv7 Android compiler..."

          find "$ANDROID_NDK_LATEST_HOME" \
            -type f \
            \( \
              -name 'armv7a-linux-androideabi*-clang' \
              -o \
              -name 'armv7a-linux-androideabi*-clang++' \
            \) \
            -print

      - name: Setup Rust target
        shell: bash
        run: |
          rustup target add "$RUST_TARGET"

      - name: Install Node dependencies
        uses: bahmutov/npm-install@v1.8.32

      - name: Build release
        shell: bash
        env:
          RUST_TARGET: ${{ env.RUST_TARGET }}
          ANDROID_NDK_LATEST_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          yarn build-release

      # ------------------------------------------------------------
      # Build the LightningCSS CLI
      # ------------------------------------------------------------

      - name: Build LightningCSS CLI
        shell: bash
        env:
          RUST_TARGET: ${{ env.RUST_TARGET }}
          ANDROID_NDK_LATEST_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cargo build \
            --release \
            --target "$RUST_TARGET" \
            --bin lightningcss \
            --features cli

      - name: Copy CLI binary
        shell: bash
        run: |
          cp \
            "target/$RUST_TARGET/release/lightningcss" \
            "lightningcss-arm-android"

          chmod +x lightningcss-arm-android

          ls -lh lightningcss-arm-android

      # ------------------------------------------------------------
      # Build N-API module
      # ------------------------------------------------------------

      - name: Build N-API module
        shell: bash
        env:
          RUST_TARGET: ${{ env.RUST_TARGET }}
          ANDROID_NDK_LATEST_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          yarn napi build \
            --release \
            --target "$RUST_TARGET" \
            --features cli

      - name: Find N-API module
        shell: bash
        run: |
          set -e

          echo "Generated .node files:"

          find . \
            -type f \
            -name '*.node' \
            -print

      - name: Rename N-API module
        shell: bash
        run: |
          set -e

          NODE_FILE="$(find . -type f -name '*.node' | head -n 1)"

          if [ -z "$NODE_FILE" ]; then
            echo "ERROR: No .node file was generated."
            exit 1
          fi

          echo "Using:"
          echo "$NODE_FILE"

          cp "$NODE_FILE" \
            lightningcss-arm-android.node

          ls -lh lightningcss-arm-android.node

      # ------------------------------------------------------------
      # Strip
      # ------------------------------------------------------------

      - name: Strip CLI
        shell: bash
        run: |
          llvm-strip lightningcss-arm-android

      - name: Strip N-API module
        shell: bash
        run: |
          llvm-strip lightningcss-arm-android.node

      # ------------------------------------------------------------
      # Verify
      # ------------------------------------------------------------

      - name: Verify binaries
        shell: bash
        run: |
          echo "=== CLI ==="
          file lightningcss-arm-android
          ls -lh lightningcss-arm-android

          echo
          echo "=== N-API ==="
          file lightningcss-arm-android.node
          ls -lh lightningcss-arm-android.node

          echo
          echo "=== ELF CLI ==="
          readelf -h lightningcss-arm-android \
            | grep -E 'Class|Machine|Type'

          echo
          echo "=== ELF N-API ==="
          readelf -h lightningcss-arm-android.node \
            | grep -E 'Class|Machine|Type'

      # ------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------

      - name: Upload ARMv7 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lightningcss-android-armv7
          path: |
            lightningcss-arm-android
            lightningcss-arm-android.node
          if-no-files-found: error
          retention-days: 30
