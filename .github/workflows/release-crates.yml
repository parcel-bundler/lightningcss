name: release-crates
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate publishing without uploading
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
    secrets:
      CRATES_IO_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: release-rspack-lightningcss-crate
  cancel-in-progress: false

jobs:
  release-crates:
    runs-on: ubuntu-latest
    name: Release Rust crate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Validate crate
        run: cargo publish -p rspack_lightningcss --dry-run
      - name: Publish crate
        if: ${{ !inputs.dry_run }}
        run: cargo publish -p rspack_lightningcss
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
