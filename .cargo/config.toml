[target.'cfg(target_env = "gnu")']
rustflags = ["-C", "link-args=-Wl,-z,nodelete"]

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"
rustflags = ["-C", "target-feature=-crt-static"]

[target.wasm32-unknown-unknown]
rustflags = [
    "-C",
    "link-arg=--export-table",
    '--cfg',
    'getrandom_backend="custom"',
    # napi-sys declares the N-API functions as undefined `extern "C"` symbols
    # that are provided by the host at runtime. rustc 1.96+ no longer passes
    # `--allow-undefined` to wasm-ld, so it must be requested explicitly.
    "-C",
    "link-arg=--allow-undefined",
]


# Statically link Visual Studio redistributables on Windows builds
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
